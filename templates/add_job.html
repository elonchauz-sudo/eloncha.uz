<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E'lon berish — eloncha.uz</title>
    
    <!-- Google qidiruv va tabda logo chiqishi uchun -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #ffffff; padding: 40px 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-box { background: white; border-radius: 20px; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; max-width: 650px; margin: auto; }
        .pay-box { background: #f1f5f9; border-radius: 12px; padding: 15px; border: 1px dashed #cbd5e1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <!-- Professional logotip va nom -->
            <div class="text-center mb-4">
                <div class="relative inline-flex items-center justify-center p-2">
                    <div class="absolute w-14 h-14 bg-blue-900 rounded-full blur-md opacity-70 -top-1 -left-2"></div>
                    <div class="absolute w-10 h-10 bg-indigo-900 rounded-full blur-sm opacity-60 -bottom-1 -right-2"></div>
                    <img src="{{ url_for('static', filename='logo.png') }}" class="relative w-14 h-14 rounded-full object-cover border-2 border-blue-600 shadow-lg" alt="eloncha.uz logo">
                </div>
                <h3 class="fw-bold text-primary mt-2">eloncha.uz — Yangi E'lon Qo'shish</h3>
                <p class="text-muted small">E'lon joylash narxi: <b>20 000 UZS</b></p>
            </div>
            
            <div class="pay-box mb-4">
                <p class="small mb-1 fw-bold text-dark">💳 To'lov uchun karta:</p>
                <h5 class="text-primary fw-bold font-monospace mb-1">9860 1701 0945 5106</h5>
                <p class="small text-muted mb-0">Qabul qiluvchi: <b>Raxmatillayev Dilshod</b></p>
            </div>

            <form method="POST" enctype="multipart/form-data">
                <!-- 1. Kategoriya tanlash -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Asosiy kategoriya:</label>
                    <select name="category" id="categorySelect" class="form-select rounded-3" required onchange="loadSubcategories()">
                        <option value="">Kategoriyani tanlang...</option>
                        {% for cat in categories.keys() %}
                            <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- 2. Sub-kategoriya tanlash (Dinamik chiqadi) -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Sub-kategoriya:</label>
                    <select name="sub_category" id="subCategorySelect" class="form-select rounded-3" required>
                        <option value="">Avval asosiy kategoriyani tanlang</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Sarlavha (Masalan: Malibu 2 yoki 3 xonali kvartira):</label>
                    <input type="text" name="title" class="form-control rounded-3" required placeholder="E'lon sarlavhasi">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Kompaniya yoki Ismingiz:</label>
                        <input type="text" name="company" class="form-control rounded-3" required placeholder="MChJ yoki Ism">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold">Narxi / Maoshi:</label>
                        <input type="text" name="salary" class="form-control rounded-3" required placeholder="20 000 $ yoki 5 mln so'm">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Hudud:</label>
                    <select name="region" class="form-select rounded-3" required>
                        {% for reg in regions %}
                            <option value="{{ reg }}">{{ reg }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Bog'lanish uchun telefon raqam:</label>
                    <input type="text" name="phone" class="form-control rounded-3" required placeholder="+998901234567">
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Batafsil ma'lumot:</label>
                    <textarea name="description" class="form-control rounded-3" rows="3" required placeholder="Tavsif..."></textarea>
                </div>
                
                <!-- E'lon rasmi -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-primary">📷 E'lon rasmi (Mahsulot yoki xizmat rasmi):</label>
                    <input type="file" name="job_img" class="form-control rounded-3" accept="image/*">
                </div>

                <!-- To'lov cheki -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-danger">📥 To'lov cheki rasmi (20 000 UZS):</label>
                    <input type="file" name="check_img" class="form-control rounded-3" required accept="image/*">
                </div>

                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">E'lonni yuborish (Admin tekshiruviga)</button>
            </form>

            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none small text-secondary">Bosh sahifaga qaytish</a>
            </div>
        </div>
    </div>

    <!-- Sub-kategoriyalarni dinamik yuklash uchun JavaScript -->
    <script>
        function loadSubcategories() {
            const category = document.getElementById('categorySelect').value;
            const subSelect = document.getElementById('subCategorySelect');
            subSelect.innerHTML = '<option value="">Yuklanmoqda...</option>';

            if (!category) {
                subSelect.innerHTML = '<option value="">Avval asosiy kategoriyani tanlang</option>';
                return;
            }

            fetch(`/get-subcategories/${encodeURIComponent(category)}`)
                .then(response => response.json())
                .then(data => {
                    subSelect.innerHTML = '';
                    if (data.length === 0) {
                        subSelect.innerHTML = '<option value="Boshqa">Boshqa</option>';
                        return;
                    }
                    data.forEach(sub => {
                        const opt = document.createElement('option');
                        opt.value = sub;
                        opt.textContent = sub;
                        subSelect.appendChild(opt);
                    });
                })
                .catch(err => {
                    console.error('Xatolik:', err);
                    subSelect.innerHTML = '<option value="">Xatolik yuz berdi</option>';
                });
        }
    </script>
</body>
</html>
