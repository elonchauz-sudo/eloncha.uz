<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildirishnomalar — eloncha.uz</title>
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card border rounded-4 p-4 shadow-sm">
            <h3 class="fw-bold text-primary mb-4"><i class="fa-solid fa-bell text-warning"></i> Tizim Bildirishnomalari</h3>
            
            <div class="list-group list-group-flush">
                {% for n in notifications %}
                    <div class="list-group-item px-0 py-3 border-bottom">
                        <div class="d-flex w-100 justify-content-between">
                            <h6 class="mb-1 fw-bold text-dark"><i class="fa-solid fa-bullhorn text-primary me-2"></i> Yangilik</h6>
                            <small class="text-muted">{{ n.date }}</small>
                        </div>
                        <p class="mb-1 text-secondary mt-1">{{ n.text }}</p>
                    </div>
                {% else %}
                    <p class="text-muted text-center py-4">Hozircha bildirishnomalar mavjud emas.</p>
                {% endfor %}
            </div>

            <div class="text-center mt-4">
                <a href="/" class="btn btn-outline-primary rounded-pill px-4 btn-sm fw-semibold"><i class="fa-solid fa-arrow-left me-1"></i> Bosh sahifaga qaytish</a>
            </div>
        </div>
    </div>
</body>
</html>
