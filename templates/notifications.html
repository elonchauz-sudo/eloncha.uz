<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildirishnomalar — eloncha.uz</title>
    
    <!-- Sayt logotipi -->
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #1e293b; padding: 40px 0; }
        .card-box { background: white; border-radius: 20px; padding: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; max-width: 650px; margin: auto; }
        
        /* Logotip orqasidagi to'q ko'k sharchalar effekti */
        .logo-container {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .logo-glow-1 {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #1e3a8a;
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0.7;
            top: -5px;
            left: -5px;
        }
        .logo-glow-2 {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #312e81;
            border-radius: 50%;
            filter: blur(6px);
            opacity: 0.6;
            bottom: -5px;
            right: -5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-box text-center">
            <!-- Professional logotip va effekti -->
            <div class="logo-container">
                <div class="logo-glow-1"></div>
                <div class="logo-glow-2"></div>
                <img src="{{ url_for('static', filename='logo.png') }}" class="rounded-circle position-relative border border-primary shadow-sm" width="45" height="45" alt="logo">
            </div>

            <h3 class="fw-bold text-primary mb-3">Tizim Bildirishnomalari</h3>
            <p class="text-muted small mb-4">eloncha.uz tomonidan yuborilgan so'nggi xabarlar</p>
            
            <div class="list-group list-group-flush text-start mb-4">
                {% for n in notifications %}
                    <div class="list-group-item px-3 py-3 border rounded-3 mb-3 bg-light">
                        <div class="d-flex w-100 justify-content-between align-items-center mb-1">
                            <h6 class="mb-0 fw-bold text-dark"><i class="fa-solid fa-bell text-warning me-2"></i> Admin xabari</h6>
                            <small class="text-muted small"><i class="fa-regular fa-calendar-days me-1"></i> {{ n.date }}</small>
                        </div>
                        <p class="mb-0 text-secondary mt-2" style="font-size: 14px;">{{ n.text }}</p>
                    </div>
                {% else %}
                    <div class="text-center py-5">
                        <i class="fa-regular fa-bell-slash text-muted display-4 mb-3"></i>
                        <p class="text-muted">Hozircha bildirishnomalar mavjud emas.</p>
                    </div>
                {% endfor %}
            </div>

            <div class="text-center">
                <a href="/" class="btn btn-primary rounded-pill px-4 btn-sm fw-semibold shadow-sm"><i class="fa-solid fa-arrow-left me-1"></i> Bosh sahifaga qaytish</a>
            </div>
        </div>
    </div>
</body>
</html>
