<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Kirish — eloncha.uz</title>
    
    <!-- Google qidiruv va tabda logo chiqishi uchun -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 45px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .form-control {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border-radius: 14px;
            padding: 12px 18px;
        }
        .form-control:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            color: white;
            border-radius: 14px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-gradient:hover {
            opacity: 0.9;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <!-- Professional logotip va aylana to'q ko'k sharchalar effekti -->
            <div class="relative inline-flex items-center justify-center p-2 mx-auto mb-3">
                <div class="absolute w-16 h-16 bg-blue-900 rounded-full blur-md opacity-70 -top-1 -left-2"></div>
                <div class="absolute w-12 h-12 bg-indigo-900 rounded-full blur-sm opacity-60 -bottom-1 -right-2"></div>
                <img src="{{ url_for('static', filename='logo.png') }}" class="relative w-14 h-14 rounded-full object-cover border-2 border-indigo-500 shadow-lg" alt="eloncha.uz logo">
            </div>
            <h3 class="fw-bold text-white">eloncha.uz Admin</h3>
            <p class="text-muted small">Tizimni boshqarish uchun ma'lumotlarni kiriting</p>
        </div>

        {% if error %}
            <div class="alert alert-danger bg-danger bg-opacity-20 border-danger text-danger py-2 small text-center rounded-3">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small text-muted fw-semibold">Login:</label>
                <input type="text" name="username" class="form-control" required placeholder="admin">
            </div>
            <div class="mb-4">
                <label class="form-label small text-muted fw-semibold">Parol:</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-gradient w-100 shadow-sm">Kirish</button>
        </form>
        <div class="text-center mt-4">
            <a href="/" class="text-decoration-none small text-muted hover-white"><i class="fa-solid fa-arrow-left me-1"></i> Bosh sahifaga qaytish</a>
        </div>
    </div>

</body>
</html>
