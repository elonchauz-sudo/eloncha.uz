<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — eloncha.uz</title>
    
   <!-- Google qidiruv va tabda logo chiqishi uchun -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #ffffff; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #1e293b; }
        .card-box { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        
        /* Logotip orqasidagi to'q ko'k sharchalar effekti */
        .logo-container {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .logo-glow-1 {
            position: absolute;
            width: 55px;
            height: 55px;
            background: #1e3a8a;
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0.7;
            top: -5px;
            left: -5px;
        }
        .logo-glow-2 {
            position: absolute;
            width: 45px;
            height: 45px;
            background: #312e81;
            border-radius: 50%;
            filter: blur(6px);
            opacity: 0.6;
            bottom: -5px;
            right: -5px;
        }
    </style>
</head>
<body>
    <div class="card-box text-center">
        <!-- Professional logotip va effekti -->
        <div class="logo-container">
            <div class="logo-glow-1"></div>
            <div class="logo-glow-2"></div>
            <img src="{{ url_for('static', filename='logo.png') }}" class="rounded-circle position-relative border border-primary shadow-sm" width="50" height="50" alt="logo">
        </div>

        <div class="mb-4">
            <h3 class="fw-bold text-primary">Tizimga kirish</h3>
            <p class="text-muted small">eloncha.uz akkauntingizga kiring</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 small text-center">{{ error }}</div>
        {% endif %}

        <form method="POST" class="text-start">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Telefon raqam:</label>
                <input type="text" name="phone" class="form-control rounded-pill px-3 py-2" required placeholder="+998901234567">
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold">Parol:</label>
                <input type="password" name="password" class="form-control rounded-pill px-3 py-2" required placeholder="******">
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-semibold shadow-sm py-2">Kirish</button>
        </form>

        <div class="text-center mt-3">
            <p class="small text-muted">Hisobingiz yo'qmi? <a href="/register" class="text-decoration-none fw-semibold">Ro'yxatdan o'tish</a></p>
            <a href="/" class="text-decoration-none small text-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Bosh sahifaga qaytish</a>
        </div>
    </div>
</body>
</html>
